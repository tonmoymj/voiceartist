<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Set New Password — VoiceCast</title>
<meta name="description" content="Set a new password for your VoiceCast account.">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='48' fill='%230A0A14'/><circle cx='50' cy='50' r='24' fill='%238B5CF6'/><path d='M44 36v28l22-14z' fill='%23FFFFFF'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<!-- Supabase JS CDN & Client -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-client.js"></script>
<script src="i18n.js"></script>
<style>
  :root{
    --bg: #0A0A14; --bg-2: #100E1E; --surface: #15132A; --surface-2: #1B1836;
    --border: #2A2745; --border-soft: #1F1C38;
    --purple: #8B5CF6; --blue: #4F8CF7; --red: #EF4444; --green: #22C55E;
    --text: #F3F1FA; --text-muted: #A9A5C4; --text-faint: #6E6A8F;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{ background:var(--bg); color:var(--text); font-family:'Inter', sans-serif; line-height:1.55; min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:24px; }
  .display{ font-family:'Space Grotesk', sans-serif; }
  a{color:inherit; text-decoration:none;}

  .reset-box{ width:100%; max-width:440px; background:var(--surface); border:1px solid var(--border); border-radius:20px; padding:36px 32px; box-shadow:0 24px 60px rgba(0,0,0,0.6); }
  .brand{ display:inline-flex; align-items:center; gap:8px; font-weight:700; font-size:1.15rem; margin-bottom:24px; }
  .brand-mark{ width:9px; height:9px; border-radius:50%; background:linear-gradient(135deg,var(--purple),var(--blue)); box-shadow:0 0 10px rgba(139,92,246,0.7); }

  .reset-title{ font-size:1.6rem; font-weight:700; margin-bottom:8px; }
  .reset-sub{ font-size:0.86rem; color:var(--text-muted); margin-bottom:24px; }

  .field{ margin-bottom:18px; }
  .field label{ display:block; font-size:0.84rem; color:var(--text-muted); margin-bottom:7px; font-weight:500; }
  .field input{ width:100%; background:var(--bg-2); border:1px solid var(--border); border-radius:9px; padding:12px 14px; color:var(--text); font-size:0.95rem; font-family:'Inter',sans-serif; outline:none; transition:border-color 0.15s; }
  .field input:focus{ border-color:var(--purple); }

  .submit-btn{ width:100%; background:linear-gradient(90deg,var(--purple),var(--blue)); color:#0B0A16; font-weight:600; font-size:0.95rem; padding:13px; border-radius:9px; border:none; cursor:pointer; margin-top:8px; box-shadow:0 4px 18px rgba(139,92,246,0.3); transition:opacity 0.15s; }
  .submit-btn:disabled{ opacity:0.6; cursor:not-allowed; }

  .msg-box{ padding:12px 16px; border-radius:10px; font-size:0.86rem; margin-bottom:18px; display:none; }
  .msg-success{ background:rgba(34,197,94,0.15); border:1px solid rgba(34,197,94,0.35); color:#BBF7D0; }
  .msg-error{ background:rgba(239,68,68,0.15); border:1px solid rgba(239,68,68,0.35); color:#FECACA; }
</style>
</head>
<body>

<div class="reset-box">
  <a class="brand display" href="/">
    <span class="brand-mark"></span>
    VoiceCast
  </a>

  <h1 class="reset-title display">Set New Password</h1>
  <p class="reset-sub">Enter your new secure password below to regain access to your VoiceCast account.</p>

  <div id="resetAlert" class="msg-box"></div>

  <form id="newPassForm">
    <div class="field">
      <label>New Password</label>
      <input type="password" id="newPassword" placeholder="At least 8 characters" required minlength="8" autofocus>
    </div>

    <div class="field">
      <label>Confirm New Password</label>
      <input type="password" id="confirmPassword" placeholder="Re-enter new password" required minlength="8">
    </div>

    <button type="submit" id="updatePassBtn" class="submit-btn">Update Password &amp; Log In</button>
  </form>

  <p style="text-align:center;font-size:0.82rem;color:var(--text-faint);margin-top:24px;">
    Remembered your password? <a href="signup" style="color:var(--purple);">Log in</a>
  </p>
</div>

<script>
  const form = document.getElementById('newPassForm');
  const alertBox = document.getElementById('resetAlert');
  const btn = document.getElementById('updatePassBtn');

  function showAlert(text, isError = false) {
    alertBox.textContent = text;
    alertBox.className = `msg-box ${isError ? 'msg-error' : 'msg-success'}`;
    alertBox.style.display = 'block';
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const newPass = document.getElementById('newPassword').value;
    const confirmPass = document.getElementById('confirmPassword').value;

    if (newPass !== confirmPass) {
      showAlert('Passwords do not match. Please re-enter.', true);
      return;
    }

    if (newPass.length < 8) {
      showAlert('Password must be at least 8 characters long.', true);
      return;
    }

    btn.disabled = true;
    btn.textContent = 'Updating password...';

    try {
      const db = window._supabase;
      if (!db) throw new Error('Supabase service unavailable.');

      const { data, error } = await db.auth.updateUser({
        password: newPass
      });

      if (error) throw error;

      showAlert('✓ Password updated successfully! Redirecting to dashboard...');
      setTimeout(() => {
        window.location.href = 'dashboard.html';
      }, 1200);
    } catch (err) {
      showAlert(err.message || 'Failed to update password. Please request a new reset link.', true);
      btn.disabled = false;
      btn.textContent = 'Update Password & Log In';
    }
  });
</script>

</body>
</html>
